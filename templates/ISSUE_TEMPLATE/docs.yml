name: Docs
description: Documentation only, with no change to how the code behaves
labels: ["type: docs", "ready-for-agent"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs writing or fixing
      description: The reader, and what they should be able to do or understand afterwards.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: Where in the code
      description: The documents to change, and the code they describe. An agent reads these and nothing else, so name them.

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this deliberately does not do, so an agent does not drift into it.

  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: How to check it, such as links that must resolve or commands in the text that must run as written.
